<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="RVAI">
  <title>RVAI</title>
  <!-- An R written in binary: a "1" for the stem, a "0" for the bowl, and the leg as bits falling like rain. -->
  <defs>
    <linearGradient id="rv-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15301f"/><stop offset=".6" stop-color="#0a1710"/><stop offset="1" stop-color="#050807"/>
    </linearGradient>
    <linearGradient id="rv-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f2"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#rv-tile)"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="12.5" fill="none" stroke="#4ade80" stroke-opacity=".35"/>
  <!-- "1": the stem, with the flag of a 1 -->
  <path d="M9.5 15 14 10.5h4.6V37.5h-5.2V17.6l-1.6 1.6z" fill="url(#rv-ink)"/>
  <!-- "0": the bowl, fused to the stem -->
  <rect x="15.9" y="12.8" width="18.8" height="13.4" rx="6.7" fill="none" stroke="url(#rv-ink)" stroke-width="4.6"/>
  <!-- falling bits: the leg -->
  <rect x="22.4" y="28.4" width="5" height="5" rx="1.3" fill="#4ade80"/>
  <rect x="27.4" y="33.4" width="5" height="5" rx="1.3" fill="#4ade80" fill-opacity=".8"/>
  <rect x="32.4" y="38.4" width="5" height="5" rx="1.3" fill="#4ade80" fill-opacity=".55"/>
</svg>
