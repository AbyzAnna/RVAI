name: Catalog foundation checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --input-type=module --check < ui/app.js
      - run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('data').glob('*.json')]"
